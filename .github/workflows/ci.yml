name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ODataSample.sln
      - name: Build
        run: dotnet build ODataSample.sln --no-restore -c Release
      - name: Test
        run: dotnet test ODataSample.sln --no-build -c Release
      - name: Pakete auf bekannte Schwachstellen prüfen
        run: dotnet list ODataSample.sln package --vulnerable --include-transitive
